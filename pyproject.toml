[project]
name = "qulay-media-bot"
version = "0.3.1"
description = "Rasm va video bilan ishlaydigan o'zbekcha Telegram bot"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC240"]
"scripts/*" = ["ASYNC240"]
